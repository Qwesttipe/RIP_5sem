<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Паттерны нагрузки серверов</title>
    <link rel="stylesheet" href="/resources/style.css">
    <style>
        /* Стили для заголовка и корзины */
        .title-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 20px 0;
        }
        
        .main-title {
            font-size: 2.5em;
            color: #fff;
            margin: 0;
        }
        
        .cart-title-level {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .cart-title-level img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }
        
        .cart-title-level img:hover {
            transform: scale(1.1);
        }
        
        /* Стили для поисковой строки с зеленой обводкой */
        .search-full-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            position: relative;
        }
        
        .search-form {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        
        .search-box {
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .search-input-field {
            width: 100%;
            padding: 12px 50px 12px 20px;
            border: 2px solid #22D463;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .search-input-field:focus {
            border-color: #1BB852;
            box-shadow: 0 0 0 3px rgba(34, 212, 99, 0.1);
        }
        
        .search-icon {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
        }
        
        .search-icon img {
            width: 20px;
            height: 20px;
        }
        
        /* Стили для карточек с зеленой обводкой */
        .loads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        
        .load-card {
            display: block;
            border: 2px solid #22D463;
            border-radius: 15px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            background: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .load-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            border-color: #1BB852;
        }
        
        .load-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .load-card h3 {
            margin: 10px 0;
            color: #000;
            font-size: 1.4em;
        }
        
        .load-card .year {
            color: #666;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .load-card p {
            color: #555;
            line-height: 1.5;
        }
        
        .container {
            margin-top: 20px;
        }
        
        /* Стили для заголовка с кнопкой */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .card-button-container {
            margin-left: 10px;
        }
        
        .card-button {
            background-color: #22D463;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            white-space: nowrap;
        }
        
        .card-button:hover {
            background-color: #1BB852;
        }
    </style>
</head>
<body>
    <!-- Хедер с логотипом -->
    <div class="header-nav">
        <a href="/" class="header-nav-link">
            <img src="http://localhost:9000/imagesforlabs/site-icon.jpg" alt="Паттерны нагрузки" class="header-nav-link">
        </a>
    </div>
    
    <!-- Контейнер заголовка с корзиной -->
    <div class="title-container">
        <h1 class="main-title">паттерны нагрузки сервера</h1>
        <!-- Корзина на уровне заголовка -->
        <a href="/loads_order/{{.orderID}}" class="cart-title-level">
            <img src="http://localhost:9000/imagesforlabs/user-icon.png" alt="Корзина расчетов">
        </a>
    </div>
    
    <!-- Контейнер поиска -->
    <div class="search-full-container">
        <form method="GET" action="/" class="search-form">
            <div class="search-box">
                <input type="text" name="load_search" class="search-input-field" placeholder="Поиск" value="{{.query}}">
                <button type="submit" class="search-icon">
                    <img src="http://127.0.0.1:9000/imagesforlabs/search-icon.png" alt="Поиск">
                </button>
            </div>
        </form>
    </div>

    <div class="container">
        <div class="loads-grid">
            {{range .loads}}
            <a href="/detailed_load/{{.ID}}" class="load-card">
                <img src="{{.Image}}" alt="{{.Title}}">
                <div class="card-header">
                    <h3>{{.Title}}</h3>
                    <form action="/orders/draft/add/{{.ID}}" method="post">
                        <div class="card-button-container">
                            <button class="card-button">В корзину</button>
                        </div>
                    </form>
                </div>
                <div class="year">НЕОБХОДИМАЯ ЧАСТОТА CPU: {{.Consumption}} HHZ.</div>
                <p><strong>Описание паттерна:</strong> {{.Description}}</p>
            </a>
            {{end}}
        </div>
    </div>
</body>
</html>
